name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install stable toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The parser and the CPU decoder alone, which emberwave-core is without
      # its default `gpu` feature.
      - run: cargo clippy -p emberwave-core --no-default-features --all-targets -- -D warnings
      # The README's figures are drawn by a script: they must be what it draws.
      - run: python3 -B scripts/readme_figures.py && git diff --exit-code docs/images

  wasm:
    name: browser build (wasm32)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install stable toolchain with the wasm target
        run: |
          rustup toolchain install stable --profile minimal --component clippy --target wasm32-unknown-unknown --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The browser player, and the core as the browser sees it: no blocking
      # calls, no clock.
      - run: cargo clippy --target wasm32-unknown-unknown -p emberwave-web -p emberwave-core -- -D warnings
      # wasm-bindgen-cli has to be the version of the wasm-bindgen crate in
      # Cargo.lock, so the cache follows the lock file, as in pages.yml.
      - name: Cache wasm-bindgen-cli
        id: wasm-bindgen
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/wasm-bindgen*
          key: wasm-bindgen-cli-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Install wasm-bindgen-cli
        if: steps.wasm-bindgen.outputs.cache-hit != 'true'
        run: |
          version=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/"/, "", $3); print $3 }' Cargo.lock)
          cargo install wasm-bindgen-cli --version "$version" --locked
      # The pages' module, built as Pages builds it, must instantiate: a
      # broken one would otherwise show only once it is published.
      - run: scripts/build_web.sh
      - run: node scripts/check_web.mjs

  build-test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux runs the GPU tests on lavapipe, a software Vulkan driver, and
          # a missing adapter there is a failure. On macOS and Windows the GPU
          # tests use whatever adapter the runner has (Metal, or DX12 with
          # WARP) and skip if there is none.
          - os: ubuntu-latest
            require_gpu: "1"
          - os: macos-latest
            require_gpu: ""
          - os: windows-latest
            require_gpu: ""
    env:
      EMBERWAVE_REQUIRE_GPU: ${{ matrix.require_gpu }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install a software Vulkan driver (lavapipe)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # The validation layer checks the Vulkan tests' use of the
          # client's device, emberwave's and wgpu's included (decision D61).
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 vulkan-tools vulkan-validationlayers
          # lavapipe alone: Vulkan loaders 1.3.284 to 1.4.344 unload the
          # drivers that find no device while other threads may be reading
          # their list, which crashes tests that create contexts in parallel
          # (decision D31). Ubuntu 24.04's loader predates that; 26.04's has it.
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n 1)
          test -f "$icd"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          VK_DRIVER_FILES=$icd vulkaninfo --summary
      - name: Install stable toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --workspace --all-targets
      # Prints which adapter the GPU tests run on, how long creating a decoder
      # takes (shader compilation) and how close the GPU is to the CPU.
      - name: Report the GPU adapter
        run: cargo test -p emberwave-core --test gpu inverse_transform -- --nocapture
      - run: cargo test --workspace
      # The C example, built with CMake against the shared library that the
      # build above made, decodes every test vector.
      - name: Run the C example
        shell: bash
        run: scripts/check_c_example.sh target/debug

  xcframework:
    name: XCFramework (iOS Simulator, macOS)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install stable toolchain with the iOS targets
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-apple-ios --target aarch64-apple-ios-sim --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: scripts/build_xcframework.sh
      - run: cargo build -p emberwave-cli
      # The C and Swift examples, linked with the XCFramework, decode the test
      # vectors on this Mac and in an iOS Simulator; for devices they are
      # linked only.
      - run: scripts/check_xcframework.sh target/debug/emberwave-cli
      # The iPhone benchmark app: built for iPhones, and run in an iOS
      # Simulator with -autorun, where it also reads a texture of
      # emberwave_decoder_decode_texture back through Metal.
      - run: scripts/check_ios_app.sh
      # The app's measurements on this Mac, emberwave's and HEVC's, by its
      # own code built against the XCFramework's library for the Mac.
      - run: scripts/bench_app_on_mac.sh -autorun
