name: Release

# Pushing a tag vX.Y.Z builds emberwave-cli and the C library (emberwave-ffi)
# for Linux, macOS and Windows and publishes a GitHub release with the
# archives, their checksums and the CHANGELOG.md section of that version as
# the notes. Run by hand (workflow_dispatch), on a branch or a tag, it builds
# and packages the same archives without checking or publishing anything: a
# rehearsal before tagging.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check the tag
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The tag names the crate version and a commit on main
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version in Cargo.toml" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tag $GITHUB_REF_NAME is not on main" >&2
            exit 1
          fi

  build:
    name: build (${{ matrix.target }})
    needs: check
    # A rehearsal has no tag to check, and then the check is skipped.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install stable toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Build
        run: cargo build --release --locked -p emberwave-cli -p emberwave-ffi
      # The static library is built on its own, so that everyday builds make
      # only the shared one. rustc prints the system libraries a program
      # linking it statically needs.
      - name: Build the static C library
        shell: bash
        run: |
          # Without --color never the line ends in a colour escape code.
          cargo rustc --release --locked --color never -p emberwave-ffi --lib \
            --crate-type staticlib -- --print native-static-libs 2>&1 | tee staticlib.log
          sed -n 's/.*native-static-libs: //p' staticlib.log | tail -n 1 > native-static-libs.txt
          test -s native-static-libs.txt
      - name: Package
        shell: bash
        run: |
          pack() {
            if [ "${{ matrix.archive }}" = zip ]; then
              7z a -bso0 "$1.zip" "$1"
            else
              tar czf "$1.tar.gz" "$1"
            fi
          }

          # A rehearsal on a branch such as feat/x has a slash in its name.
          ref=${GITHUB_REF_NAME//\//-}

          name="emberwave-cli-${ref}-${{ matrix.target }}"
          exe=emberwave-cli
          if [ "$RUNNER_OS" = Windows ]; then exe=emberwave-cli.exe; fi
          mkdir "$name"
          cp "target/release/$exe" README.md LICENSE CHANGELOG.md "$name/"
          pack "$name"

          name="emberwave-ffi-${ref}-${{ matrix.target }}"
          mkdir -p "$name/include" "$name/lib"
          cp crates/emberwave-ffi/include/emberwave.h "$name/include/"
          case "$RUNNER_OS" in
            Linux) libs="libemberwave_ffi.so libemberwave_ffi.a" ;;
            macOS) libs="libemberwave_ffi.dylib libemberwave_ffi.a" ;;
            Windows) libs="emberwave_ffi.dll emberwave_ffi.dll.lib emberwave_ffi.lib" ;;
          esac
          for lib in $libs; do cp "target/release/$lib" "$name/lib/"; done
          cp native-static-libs.txt "$name/lib/"
          cp crates/emberwave-ffi/README.md LICENSE CHANGELOG.md "$name/"
          pack "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: emberwave-*.${{ matrix.archive }}
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The notes are the CHANGELOG.md section headed "## [X.Y.Z]".
          version="${GITHUB_REF_NAME#v}"
          awk -v v="[$version]" '/^## /{p = index($0, v) > 0; next} p' CHANGELOG.md > notes.md
          test -s notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
            --title "emberwave $GITHUB_REF_NAME" --notes-file notes.md
