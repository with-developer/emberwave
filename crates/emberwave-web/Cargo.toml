[package]
name = "emberwave-web"
description = "emberwave in the browser: decode PyroWave files with WebGPU"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Everything is for the browser build; on other targets the crate is empty.
# The versions follow what wgpu 30 itself requires.
[target.'cfg(target_arch = "wasm32")'.dependencies]
emberwave-core.workspace = true
wgpu = { workspace = true, features = ["webgpu"] }
wasm-bindgen = "0.2.127"
wasm-bindgen-futures = "0.4.77"
web-sys = { version = "0.3.104", features = ["console", "HtmlCanvasElement", "Performance", "Window"] }

[lints]
workspace = true
