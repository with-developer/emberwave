[package]
name = "emberwave-wgpu"
description = "PyroWave decoder and encoder on the GPU, in wgpu/WGSL, on top of emberwave-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# Not on crates.io until the maintainer takes the name (decision D75).
publish.workspace = true

[dependencies]
# The hidden items of the core that this crate uses may change in any release,
# so it takes exactly its own version of the core.
emberwave-core = { workspace = true }
thiserror.workspace = true
wgpu.workspace = true
pollster.workspace = true
bytemuck.workspace = true

[dev-dependencies]
proptest.workspace = true
naga.workspace = true
# The tests count wgpu's live resources to show that decoding allocates
# nothing per frame; the counters cost a little, so only tests turn them on.
wgpu = { workspace = true, features = ["counters"] }

[lints]
workspace = true
