# How include/emberwave.h is generated from src/lib.rs. tests/header.rs runs
# cbindgen with this file and fails when the committed header differs;
# EMBERWAVE_BLESS=1 cargo test -p emberwave-ffi --test header rewrites it.
language = "C"
header = """/*
 * emberwave: decode and encode PyroWave video on the GPU.
 * https://github.com/with-developer/emberwave
 * SPDX-License-Identifier: MIT
 *
 * Conventions:
 * - Functions that can fail return an EmberwaveStatus. After a failure,
 *   emberwave_last_error() describes it, on the thread that made the call.
 * - Objects are opaque. *_create makes one, *_destroy frees it, and
 *   destroying NULL does nothing.
 * - A context may be used by several threads at once. A decoder or an
 *   encoder may move between threads, but only one thread may use it at a
 *   time. A context keeps a few hundred bytes for every thread that has
 *   called it or its decoders and encoders, until they are all destroyed,
 *   as wgpu keeps its error scopes by thread: call from a pool of threads,
 *   not from new ones without end.
 * - A panic inside emberwave is reported as EMBERWAVE_STATUS_INTERNAL.
 *   Destroy the object it happened in.
 * - Later versions may add statuses: treat any status but
 *   EMBERWAVE_STATUS_OK as a failure.
 * - A struct passed by pointer starts with struct_size, which the caller
 *   sets to sizeof the struct before the call: for the structs it passes in
 *   and for those it gets filled in. emberwave reads and writes no more
 *   bytes than that, and takes members a shorter struct lacks as zeros, their
 *   defaults, so that a program built with an older header works with a
 *   newer library.
 * - Callbacks given to emberwave must not call emberwave.
 * - EMBERWAVE_VERSION is the version of this header, and
 *   emberwave_version_number() that of the library.
 * - The calls on Metal, Vulkan and Direct3D objects of the caller's are
 *   provisional: until a client has used them, a minor version may change
 *   them.
 */"""
autogen_warning = "/* Generated by cbindgen from crates/emberwave-ffi/src/lib.rs; do not edit. */"
include_guard = "EMBERWAVE_H"
include_version = false
cpp_compat = true
documentation = true
documentation_style = "c99"
style = "both"
usize_is_size_t = true
no_includes = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]

[enum]
rename_variants = "QualifiedScreamingSnakeCase"

[export]
include = ["EmberwaveStatus"]
