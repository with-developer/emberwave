[package]
name = "emberwave-ffi"
description = "C API for emberwave: decode PyroWave video on the GPU from C"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# The shared library for C programs, and an rlib for the tests. Releases also
# build a static library, with `cargo rustc --crate-type staticlib`.
crate-type = ["cdylib", "rlib"]

[dependencies]
emberwave-core.workspace = true
wgpu.workspace = true

# A context on the caller's own Metal device and queue
# (emberwave_context_create_metal), and the caller's own textures
# (emberwave_texture_from_metal). wgpu uses these crates on Apple systems
# already, and the core uses pollster.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = "0.6"
objc2-metal = { version = "0.3", default-features = false, features = [
    "std",
    "MTLAllocation",
    "MTLCommandQueue",
    "MTLDevice",
    "MTLPixelFormat",
    "MTLResource",
    "MTLTexture",
] }
pollster.workspace = true

# A context on the caller's own Vulkan device (emberwave_context_create_vulkan),
# where wgpu runs on Vulkan; not on 32-bit Windows, where Vulkan's calling
# convention is not C's. wgpu uses ash already, the same version.
[target.'cfg(any(target_os = "linux", target_os = "android", all(windows, target_pointer_width = "64")))'.dependencies]
ash = "0.38"

# Textures and fences of the caller's Direct3D 12 or Direct3D 11 device,
# shared through NT handles (emberwave_context_create_d3d12 and the _d3d12
# calls). wgpu's Direct3D 12 backend uses both crates already, the same
# versions.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }
pollster.workspace = true

[dev-dependencies]
# tests/header.rs generates the C header to check the committed one.
cbindgen = { version = "0.29", default-features = false }

# tests/metal.rs reads the C API's textures through Metal itself, as an app
# does. wgpu uses both crates on Apple systems already.
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2 = "0.6"
objc2-metal = { version = "0.3", default-features = false, features = [
    "std",
    "MTLAllocation",
    "MTLBlitCommandEncoder",
    "MTLBuffer",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLCommandQueue",
    "MTLDevice",
    "MTLEvent",
    "MTLPixelFormat",
    "MTLResource",
    "MTLTexture",
    "MTLTypes",
] }

# tests/d3d12.rs shares textures and a fence of a Direct3D 11 device with
# emberwave's, as a Windows host or client does. wgpu's Direct3D 12 backend
# uses the crate already.
[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Security",
] }

# The workspace forbids unsafe code, and a C API cannot do without it, so this
# crate has a table of its own: unsafe code is allowed, but every unsafe
# operation needs an unsafe block of its own with a SAFETY comment.
[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
